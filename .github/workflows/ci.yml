name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Testes de unidade + integração (Testcontainers usa o Docker do runner)
      - name: Build e testes
        run: ./mvnw -B verify

      - name: Imagem Docker
        run: docker build -t clinica-api:ci .
